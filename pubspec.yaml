name: monematex
description: MoneyMateX - AI-Powered Personal Finance & Net Worth Platform built with Flutter, Riverpod, GoRouter, and Dio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.0.0

  # HTTP Client
  dio: ^5.4.1

  # Firebase Authentication & Environment Configuration
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  # Storage & Utilities
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0

  # Fonts & UI Utilities
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logos/
    - assets/icons/
    - assets/images/
    - assets/illustrations/
    - assets/fonts/



# MoneyMateX Spring Boot Production & Local Properties
server.port=${PORT:3000}

# Database Configuration (Defaults to local H2 fallback; overrides via environment variables for PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/monematex_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVERClassName:${SPRING_DATASOURCE_DRIVER:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 Console (Accessible locally at http://localhost:3000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# AI Assistant & OCR Configuration (Gemini 2.0 Flash)
ai.provider=${AI_PROVIDER:gemini}
ai.model=${AI_MODEL:gemini-2.0-flash}
ai.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}

# Security & CORS
jwt.secret=${JWT_SECRET:MoneyMateX_Super_Secret_JWT_Key_2026_For_Financial_Security_App!}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

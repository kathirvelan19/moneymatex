# MoneyMateX Spring Boot Application Properties
server.port=${PORT:3000}

# Database Configuration (H2 File-based Persistence)
spring.datasource.url=jdbc:h2:file:./data/monematex_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console (Accessible at http://localhost:3000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# AI Assistant Configuration
ai.provider=gemini
ai.model=gemini-2.0-flash
ai.api.key=${AI_API_KEY:}

# MoneyMateX Spring Boot Production & Local Properties
server.port=${PORT:3000}

# Database Configuration (Defaults to local H2 fallback; overrides via environment variables for PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/monematex_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVERClassName:${SPRING_DATASOURCE_DRIVER:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 Console (Accessible locally at http://localhost:3000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Gemini AI Configuration
# Set GEMINI_API_KEY environment variable in Render (production) or locally.
# This is the ONLY variable name used. Do NOT use AI_API_KEY or GOOGLE_API_KEY.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# OCR Debug Mode — set OCR_DEBUG=true in Render environment to enable detailed OCR logging
ocr.debug=${OCR_DEBUG:false}

# Multipart upload limits — receipt images up to 10 MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Security & CORS
jwt.secret=${JWT_SECRET:MoneyMateX_Super_Secret_JWT_Key_2026_For_Financial_Security_App!}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
